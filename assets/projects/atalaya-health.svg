<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Atalaya recorded scraper health check</title>
  <desc id="desc">A dated summary of bhound health. Eight of nine sources returned remote developer job offers on 24 August 2026. The source JSON is stored beside the profile asset.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#06080c"/>
  <rect x="36" y="36" width="1128" height="603" rx="20" fill="url(#background)" stroke="#30363d" filter="url(#shadow)"/>
  <path d="M36 92h1128" stroke="#30363d"/>
  <circle cx="70" cy="64" r="7" fill="#ff7b72"/>
  <circle cx="94" cy="64" r="7" fill="#d29922"/>
