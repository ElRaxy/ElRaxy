, EARS</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.57s" dur="0.45s" fill="freeze"/><rect x="174" y="96" width="130" height="96" rx="8" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1.2"/><text x="188" y="124" fill="#1F2328" font-size="14" font-weight="700" letter-spacing="1.4">PLAN</text><text x="190" y="148" fill="#59636E" font-size="10.5">blast radius</text><text x="190" y="163" fill="#59636E" font-size="10.5">declared first</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.79s" dur="0.45s" fill="freeze"/><rect x="318" y="96" width="130" height="96" rx="8" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1.2"/><text x="332" y="124" fill="#1F2328" font-size="14" font-weight="700" letter-spacing="1.4">BUILD</text><text x="334" y="148" fill="#59636E" font-size="10.5">subagents write</text><text x="334" y="163" fill="#59636E" font-size="10.5">to files</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.01s" dur="0.45s" fill="freeze"/><rect x="462" y="96" width="130" height="96" rx="8" fill="#F6F8FA" stroke="#1A7F37" stroke-width="1.2"/><text x="476" y="124" fill="#1F2328" font-size="14" font-weight="700" letter-spacing="1.4">REVIEW</text><circle cx="578" cy="118" r="4" fill="#1A7F37"/><text x="478" y="148" fill="#59636E" font-size="10.5">3 tries, then</text><text x="478" y="163" fill="#59636E" font-size="10.5">it escalates</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.23s" dur="0.45s" fill="freeze"/><rect x="606" y="96" width="130" height="96" rx="8" fill="#F6F8FA" stroke="#1A7F37" stroke-width="1.2"/><text x="620" y="124" fill="#1F2328" font-size="14" font-weight="700" letter-spacing="1.4">VERIFY</text><circle cx="722" cy="118" r="4" fill="#1A7F37"/><text x="622" y="148" fill="#59636E" font-size="10.5">tests, then a</text><text x="622" y="163" fill="#59636E" font-size="10.5">real browser</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.45s" dur="0.5s" fill="freeze"/><rect x="750" y="96" width="78" height="96" rx="8" fill="none" stroke="#0969DA" stroke-width="1.2" stroke-dasharray="4 3"/><text x="789" y="140" fill="#0969DA" font-size="13" font-weight="700" text-anchor="middle">SHIP</text><text x="789" y="158" fill="#59636E" font-size="9.5" text-anchor="middle">or back</text></g><line x1="30" y1="232" x2="830" y2="232" stroke="#D1D9E0" stroke-width="1" stroke-dasharray="860" stroke-dashoffset="860"><animate attributeName="stroke-dashoffset" from="860" to="0" begin="0.2s" dur="1.4s" fill="freeze"/></line><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.6s" fill="freeze"/><text x="30" y="256" fill="#59636E" font-size="10.5">84 skills · 13 agents · 41 commands · 10 rules · 121 ADRs · 116 runbooks</text><text x="830" y="256" fill="#59636E" font-size="10.5" text-anchor="end">counted 2026-08-20</text></g>
