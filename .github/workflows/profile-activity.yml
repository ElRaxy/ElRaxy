name: Update profile activity

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Generate contribution animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ElRaxy
          outputs: |
            dist/github-snake.svg?color_snake=#2448ff
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#879aff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish only the generated SVGs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin output
          activity_dir="$RUNNER_TEMP/profile-activity-output"
          git worktree add --detach "$activity_dir" FETCH_HEAD
          cp dist/github-snake.svg dist/github-snake-dark.svg "$activity_dir/"
          git -C "$activity_dir" add -- github-snake.svg github-snake-dark.svg
          if git -C "$activity_dir" diff --cached --quiet; then
            exit 0
          fi
          git -C "$activity_dir" config user.name 'github-actions[bot]'
          git -C "$activity_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$activity_dir" commit -m 'chore: actualizar actividad del perfil'
          git -C "$activity_dir" push origin HEAD:output
